name: One-shot revert toll labels keep station order

on:
  push:
    branches:
      - feature/toll-names-station-route-order
    paths:
      - .github/workflows/oneshot-revert-toll-labels-keep-station-order.yml
      - .github/revert_toll_labels.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/toll-names-station-route-order
      - name: Revert toll labels only
        run: python .github/revert_toll_labels.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Retire les faux noms de péages, garde l'ordre des stations"
          git push
