name: Patch tolls city-level endpoints

on:
  push:
    branches:
      - fix/tolls-city-level-endpoints
    paths:
      - .github/workflows/patch-tolls-city-level.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use city-level endpoints for toll estimation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = "\n// Itinéraires de tronçons mis en cache pour la durée du calcul :"
          helper = r'''
          // Pour les péages seulement, ramène une adresse/POI précis au centre
          // de sa commune. Le vrai trajet reste calculé depuis l'adresse exacte.
          function normaliserTexteVille(s) {
            return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
          }
          async function pointVillePourPeage(lieu, coordExacte) {
            if (!lieu || parseGPS(lieu)) return { lieu, coord: coordExacte, change: false };
            try {
              const results = await searchPlaces(lieu, 5);
              if (!results.length) return { lieu, coord: coordExacte, change: false };
              const cle = lieu.trim().toLowerCase();
              const exact = results.find(r => (r.label || '').trim().toLowerCase() === cle);
              const source = exact || results[0];
              const ville = (source.city || '').trim();
              if (!ville || normaliserTexteVille(ville) === normaliserTexteVille(lieu)) {
                return { lieu, coord: coordExacte, change: false };
              }
              const villes = await searchPlaces(ville, 5);
              if (!villes.length) return { lieu, coord: coordExacte, change: false };
              const villeNorm = normaliserTexteVille(ville);
              const centre = villes.find(r => normaliserTexteVille(r.label) === villeNorm)
                || villes.find(r => normaliserTexteVille(r.city) === villeNorm)
                || villes[0];
              if (!centre || !isFinite(centre.lng) || !isFinite(centre.lat)) {
                return { lieu, coord: coordExacte, change: false };
              }
              return { lieu: ville, coord: [centre.lng, centre.lat], change: true };
            } catch (e) {
              return { lieu, coord: coordExacte, change: false };
            }
          }
          '''
          # Les espaces de tête viennent de l'indentation YAML du here-doc.
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n'
          if s.count(marker) != 1:
            raise SystemExit(f'helper marker count={s.count(marker)}')
          s = s.replace(marker, '\n' + helper + marker, 1)

          old = """    // Péages du rapide (best-effort, Vinci puis ViaMichelin).\n    const peage = aucunPeageAttendu ? { cost: 0, details: null } : await getTolls(routeRapide, c1, c2, depart, arrivee);\n"""
          new = """    // Péages du rapide (best-effort, Vinci puis ViaMichelin).\n    // Pour un trajet direct, une adresse précise est ramenée à sa ville\n    // UNIQUEMENT pour le tracé transmis au moteur de péage. Distance, durée,\n    // carburant, navigation et stations restent basés sur l'adresse exacte.\n    let routePourPeage = routeRapide;\n    let c1Peage = c1, c2Peage = c2;\n    let departPeage = depart, arriveePeage = arrivee;\n    if (!aucunPeageAttendu && lieux.length === 2) {\n      try {\n        const [pDepart, pArrivee] = await Promise.all([\n          pointVillePourPeage(depart, c1),\n          pointVillePourPeage(arrivee, c2),\n        ]);\n        if (pDepart.change || pArrivee.change) {\n          const coordsPeage = [pDepart.coord, pArrivee.coord];\n          routePourPeage = await getRoute(coordsPeage, apiKey, false);\n          c1Peage = pDepart.coord;\n          c2Peage = pArrivee.coord;\n          departPeage = pDepart.lieu;\n          arriveePeage = pArrivee.lieu;\n        }\n      } catch (e) {\n        routePourPeage = routeRapide;\n        c1Peage = c1; c2Peage = c2;\n        departPeage = depart; arriveePeage = arrivee;\n      }\n    }\n    const peage = aucunPeageAttendu\n      ? { cost: 0, details: null }\n      : await getTolls(routePourPeage, c1Peage, c2Peage, departPeage, arriveePeage);\n"""
          if s.count(old) != 1:
            raise SystemExit(f'toll anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          grep -q "async function pointVillePourPeage" index.html
          grep -q "let routePourPeage = routeRapide" index.html
          grep -q "getTolls(routePourPeage, c1Peage, c2Peage" index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Calcule les péages au niveau ville pour les adresses précises"
          git push
