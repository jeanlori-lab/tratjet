name: Patch equal-price station distance tiers

on:
  push:
    branches:
      - feature/filter-cheapest-ties-distance
    paths:
      - .github/workflows/patch-equal-price-distance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Filter equal-price stations by distance to route
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = """    lastStationsMinTrajet = bests.sort((a, b) => a.kmSurTrajet - b.kmSurTrajet);\n    return best;\n"""
          new = """    const exAequo = bests.sort((a, b) => a.kmSurTrajet - b.kmSurTrajet);\n\n    // Quand plusieurs stations partagent exactement le prix minimum, on\n    // privilégie celles qui collent réellement au trajet : d'abord à 500 m\n    // maximum de la route, puis à 1 km maximum s'il n'y en a aucune à 500 m.\n    // Au-delà de 1 km, on n'affiche plus une liste d'ex aequo : on garde\n    // seulement la plus proche de la route pour éviter de proposer plusieurs\n    // détours lointains au même prix.\n    if (exAequo.length >= 2) {\n      const a500m = exAequo.filter(st => st.distRoute <= 0.5);\n      if (a500m.length) {\n        lastStationsMinTrajet = a500m;\n        return a500m[0];\n      }\n\n      const a1km = exAequo.filter(st => st.distRoute <= 1);\n      if (a1km.length) {\n        lastStationsMinTrajet = a1km;\n        return a1km[0];\n      }\n\n      const plusProche = exAequo.reduce((a, b) => a.distRoute <= b.distRoute ? a : b);\n      lastStationsMinTrajet = [plusProche];\n      return plusProche;\n    }\n\n    lastStationsMinTrajet = exAequo;\n    return best;\n"""

          if s.count(old) != 1:
              raise SystemExit(f'Expected target block exactly once, found {s.count(old)}')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          grep -q "const a500m = exAequo.filter(st => st.distRoute <= 0.5);" index.html
          grep -q "const a1km = exAequo.filter(st => st.distRoute <= 1);" index.html
          grep -q "lastStationsMinTrajet = \[plusProche\];" index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Filtre les stations ex aequo par proximité du trajet"
          git push
